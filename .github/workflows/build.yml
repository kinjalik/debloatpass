name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    # Pinned on purpose: ubuntu-latest migrates to Ubuntu 26.04 from 2026-10-19, which would
    # silently change the build OS/preinstalled SDK. Bump this label deliberately.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release on tags
      security-events: write # upload lint SARIF to code scanning
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # artifact storage record for the attestation
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      # A commit made on Windows may lose the executable bit.
      - run: chmod +x gradlew

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # No setup-android: ubuntu-latest already ships the Android SDK (ANDROID_HOME) with
      # accepted licenses, and AGP downloads a missing platform itself. setup-android@v3
      # by default asks sdkmanager for the removed "tools" package and fails.

      # cache-provider: basic = MIT-licensed caching over actions/cache; the default
      # "enhanced" provider is a proprietary component under Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check that the tag matches versionName
        if: env.IS_RELEASE == 'true'
        run: |
          v="$(./gradlew -q :app:printVersionName)"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $v (expected v$v)"
            exit 1
          fi

      - name: Set up the signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not set (see README)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      # Lint findings show up in the Security → Code scanning tab and on PRs.
      - name: Upload lint results
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: debloatpass-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare release files
        if: env.IS_RELEASE == 'true'
        run: |
          apk="debloatpass-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          echo "APK=$apk" >> "$GITHUB_ENV"

      # Signed SLSA provenance: `gh attestation verify <apk> -R kinjalik/debloatpass`
      # proves the APK was built by this workflow from this commit.
      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.APK }}

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" SHA256SUMS \
            --title "DebloatPass $GITHUB_REF_NAME" \
            --generate-notes
