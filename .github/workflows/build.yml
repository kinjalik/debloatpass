name: build

# CI for every push and PR: style, unit tests, lint, an (unsigned) release build, and a
# reproducibility check. Signed releases are built by release.yml.

on:
  # main + PRs (Dependabot, release-please, forks); a branch pushed without a PR gets no run,
  # and a PR branch no longer runs twice (push + pull_request).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded; every commit on main keeps its full CI (release.yml waits for it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pinned on purpose: ubuntu-latest migrates to Ubuntu 26.04 from 2026-10-19, which would
    # silently change the build OS/preinstalled SDK. Bump this label deliberately.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload lint SARIF to code scanning
    env:
      # Strict on main: a dependency not in gradle/verification-metadata.xml fails the build.
      # Lenient (warnings) on PRs, so Dependabot updates can still be tested before regenerating.
      VERIFY: ${{ github.event_name == 'pull_request' && 'lenient' || 'strict' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # No setup-android: the runner already ships the Android SDK (ANDROID_HOME) with
      # accepted licenses, and AGP downloads a missing platform itself.

      # cache-provider: basic = MIT-licensed caching over actions/cache; the default
      # "enhanced" provider is a proprietary component under Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: ktlint
        run: ./gradlew --no-daemon --dependency-verification="$VERIFY" ktlintCheck

      - name: Unit tests
        run: ./gradlew --no-daemon --dependency-verification="$VERIFY" testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon --dependency-verification="$VERIFY" lintDebug

      # Lint findings show up in the Security → Code scanning tab and on PRs.
      - name: Upload lint results
        # Fork PRs get a read-only token and could not upload; they still fail on lint errors.
        if: >-
          ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Build (unsigned)
        run: ./gradlew --no-daemon --dependency-verification="$VERIFY" assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debloatpass-unsigned-apk
          path: app/build/outputs/apk/release/*.apk

  reproducible:
    # Two builds of the same commit from different directories must give a byte-identical
    # (unsigned) APK. That's what F-Droid / IzzyOnDroid reproducible-build checks rely on.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERIFY: ${{ github.event_name == 'pull_request' && 'lenient' || 'strict' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true # the check job owns cache writes

      - name: Build twice and compare
        run: |
          second="$RUNNER_TEMP/second-checkout"
          git clone --quiet "$GITHUB_WORKSPACE" "$second"
          ./gradlew --no-daemon --no-build-cache --dependency-verification="$VERIFY" assembleRelease
          (cd "$second" && ./gradlew --no-daemon --no-build-cache --dependency-verification="$VERIFY" assembleRelease)
          a=app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum "$a" "$second/$a"
          if ! cmp -s "$a" "$second/$a"; then
            echo "::error::The two builds differ, the APK is not reproducible"
            exit 1
          fi
