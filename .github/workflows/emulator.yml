name: emulator

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  instrumented:
    # Pinned like build.yml: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]
    steps:
      - uses: actions/checkout@v7

      # A commit made on Windows may lose the executable bit.
      - run: chmod +x gradlew

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # No setup-android: ubuntu-latest already ships the Android SDK (ANDROID_HOME);
      # the emulator runner installs the emulator and system image itself.

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # build.yml uses the same cache key and runs at the same time; only it writes the
          # cache, otherwise the parallel jobs race and warn "Unable to reserve cache".
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cold boot every time, no AVD snapshot cache: restoring a cached snapshot made the
      # API 24 emulator die during boot (adb exit 137), and a cold boot only costs ~1-2 min.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
