name: emulator

on:
  # main + PRs (Dependabot, release-please, forks); a branch pushed without a PR gets no run,
  # and a PR branch no longer runs twice (push + pull_request).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded; every commit on main keeps its full CI (release.yml waits for it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  instrumented:
    # Pinned like build.yml: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 24 = minSdk; 34 = last without enforced edge-to-edge; 36 = targetSdk (edge-to-edge,
        # applyInsets()).
        api-level: [24, 34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # No setup-android: the runner already ships the Android SDK (ANDROID_HOME);
      # the emulator runner installs the emulator and system image itself.

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # build.yml uses the same cache key and runs at the same time; only it writes the
          # cache, otherwise the parallel jobs race and warn "Unable to reserve cache".
          cache-read-only: true

      # Fetch dependencies and build both APKs before the emulator starts. Several jobs hit Maven
      # Central at once on a cold cache, and it answers 429 Too Many Requests; a retry here is
      # cheap, a failure inside the emulator step wastes its boot.
      - name: Build the app and test APKs
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest && exit 0
            echo "::warning::Gradle failed (attempt $attempt), retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cold boot every time, no AVD snapshot cache: restoring a cached snapshot made the
      # API 24 emulator die during boot (adb exit 137), and a cold boot only costs ~1-2 min.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: androidTest-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
