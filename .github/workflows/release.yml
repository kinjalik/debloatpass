name: release

# release-please keeps a "chore(main): release x.y.z" PR open that bumps version.txt and
# CHANGELOG.md from Conventional Commits. Merging it creates a *draft* GitHub Release (not
# public) and its vX.Y.Z tag; release-please needs the tag to know the version is out, or it
# opens the same release PR again. The publish job (gated by the "release" environment) then builds,
# signs and attaches the APK, and only then publishes the release.
# If anything fails, the release stays a draft: nobody (Obtainium included) sees a release
# without an APK.

on:
  push:
    branches: [main]
  # Publishes an existing draft release (e.g. one whose publish job failed): re-running the
  # whole push run would not help, because release-please only reports a new release once.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to build and publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release commits, tags and releases
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Which release to build: the one release-please just created, or the draft named by hand.
  target:
    needs: release-please
    if: >-
      ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch'
          || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only tokens with push access can see draft releases
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            tag="$RP_TAG" sha="$RP_SHA"
          else
            tag="$INPUT_TAG"
            read -r draft sha < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"')
            if [ "$draft" != true ]; then
              echo "::error::$tag is not a draft release"
              exit 1
            fi
          fi
          # A branch name here would build whatever main is now, not the release commit.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected tag '$tag' or commit '$sha'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Checks the release commit (release-please's version bump never ran CI: PRs opened with the
  # workflow token don't trigger other workflows). A separate job on its own runner with no
  # secrets: tests run code Gradle can't verify (e.g. Robolectric downloads its Android jars
  # itself), and nothing they do can reach the signing key in the publish job.
  verify:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Check that the tag matches versionName
        run: |
          v="$(./gradlew -q --dependency-verification=strict :app:printVersionName)"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $v (expected v$v)"
            exit 1
          fi

      - name: ktlint, unit tests, Android Lint
        run: ./gradlew --no-daemon --dependency-verification=strict ktlintCheck testDebugUnitTest lintDebug

  publish:
    needs: [target, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    # Protect it with required reviewers (Settings → Environments → release) so a merged
    # release PR still waits for an explicit approval before anything is built or published.
    environment: release
    permissions:
      contents: write # upload the APK to the release
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # artifact storage record for the attestation
    env:
      TAG: ${{ needs.target.outputs.tag }}
    steps:
      # Check out the exact commit the release points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # No Gradle cache for the signed release build: nothing from other runs can leak into it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not set (see README)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --dependency-verification=strict assembleRelease

      # Right after signing, and even if the build failed: the key is not needed any more.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare release files
        run: |
          apk="debloatpass-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          echo "APK=$apk" >> "$GITHUB_ENV"

      # Signed SLSA provenance: `gh attestation verify <apk> -R kinjalik/debloatpass`
      # proves the APK was built by this workflow from the tagged commit.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.APK }}

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber: a re-run after a later step failed replaces the (reproducible) files.
        run: gh release upload "$TAG" "$APK" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # Last step on purpose: only a release that already has its APK becomes public.
      # The tag normally exists already (force-tag-creation); for an older draft without one,
      # publishing creates it at the release commit.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
