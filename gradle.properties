org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The app has no dependencies; AndroidX is only pulled in by test libraries (Robolectric, androidx.test).
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Dependency verification (gradle/verification-metadata.xml): only warn by default, so local
# builds and Dependabot PRs keep working; CI on main and the signed release build run with
# --dependency-verification=strict. After a dependency update, regenerate (see README).
org.gradle.dependency.verification=lenient
